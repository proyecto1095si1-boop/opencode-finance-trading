[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-finance-trading"
version = "0.1.0"
description = "Modular autonomous trading system with paper trading, structure analysis and risk controls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"mcp>=1.0.0",
	"playwright>=1.45.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
